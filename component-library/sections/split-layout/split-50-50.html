<!--
  COMPONENT: split-layout (variant: split-50-50)
  USE: Even-split section — label/tag → headline → paragraph → CTA on text
       side; large image on the visual side. 50% / 50% column width.
  BEST FOR: "About Us" intros, feature highlights, service overviews.
  EXPECTED CSS VARS:
    --split-gap              (default: var(--space-2xl))
    --color-text, --color-text-muted, --color-cta-bg, --color-cta-text
  MOTION: text side reveals first (staggered: tag→headline→body→CTA),
          visual side fades in at 200ms.
  RESPECTS: prefers-reduced-motion.
  USED IN: [add client projects here]
  DEPENDENCIES: _base/*.css, split-layout.css, split-layout.js
                GSAP 3.12.5 + ScrollTrigger (CDN)
-->
<section class="split split--50-50" aria-label="Why choose us">
  <div class="split__text">
    <span class="split__tag">Our Approach</span>
    <h2 class="split__headline">Strategic design that drives measurable revenue</h2>
    <p class="split__body">
      Every decision we make — from information architecture to button placement — is backed by conversion data. We don't just make sites look good; we make them work for your business.
    </p>
    <a href="#process" class="split__cta">See Our Process</a>
  </div>

  <div class="split__visual" aria-hidden="true">
    <img
      class="split__img"
      src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=800&q=80"
      alt="Team collaborating on design strategy"
      loading="lazy"
      decoding="async"
    />
  </div>
</section>
